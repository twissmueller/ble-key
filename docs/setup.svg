<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Helvetica, Arial, sans-serif">
  <!-- User's view of a finished key: paddle → 3.5 mm TRS plug → jack on the BLE key,
       USB-C for power / charging, Bluetooth LE to the Longpath app, which plays the sidetone.
       Opaque white card, so it reads the same in GitHub's light and dark mode. -->
  <rect width="960" height="500" rx="18" fill="#ffffff"/>

  <!-- ======================= 1. paddle ======================= -->
  <g transform="translate(40,110)">
    <!-- base -->
    <rect x="0" y="70" width="150" height="46" rx="8" fill="#374151" stroke="#111827" stroke-width="2"/>
    <!-- levers (dit left, dah right as seen from the operator) -->
    <rect x="58" y="10" width="10" height="66" rx="3" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="82" y="10" width="10" height="66" rx="3" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="44" y="0" width="22" height="34" rx="6" fill="#d1d5db" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="84" y="0" width="22" height="34" rx="6" fill="#d1d5db" stroke="#4b5563" stroke-width="1.5"/>
    <text x="75" y="142" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Your key or paddle</text>
    <text x="75" y="161" font-size="12" fill="#4b5563" text-anchor="middle">e.g. Xiegu VK-5</text>
    <text x="75" y="177" font-size="12" fill="#4b5563" text-anchor="middle">straight key or iambic paddle</text>
  </g>

  <!-- paddle cable → plug -->
  <path d="M 190 203 C 225 203, 225 203, 252 203" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>

  <!-- ======================= 2. 3.5 mm TRS plug ======================= -->
  <g transform="translate(250,188)">
    <rect x="0" y="0" width="52" height="30" rx="6" fill="#1f2937"/>
    <rect x="52" y="7" width="26" height="16" fill="#111827"/>      <!-- sleeve -->
    <rect x="78" y="7" width="4" height="16" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="82" y="7" width="16" height="16" fill="#2563eb"/>      <!-- ring -->
    <rect x="98" y="7" width="4" height="16" fill="#f8fafc" stroke="#94a3b8"/>
    <path d="M 102 7 L 114 7 Q 122 15 114 23 L 102 23 Z" fill="#eab308"/>  <!-- tip -->
    <text x="57" y="-12" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">3.5 mm stereo (TRS) plug</text>
    <!-- labels -->
    <g font-size="12" font-weight="bold">
      <line x1="110" y1="23" x2="110" y2="52" stroke="#a16207" stroke-width="1.5"/>
      <text x="110" y="66" fill="#a16207" text-anchor="middle">Tip</text>
      <text x="110" y="80" fill="#a16207" text-anchor="middle" font-weight="normal">dit</text>
      <line x1="90" y1="23" x2="78" y2="98" stroke="#2563eb" stroke-width="1.5"/>
      <text x="78" y="112" fill="#2563eb" text-anchor="middle">Ring</text>
      <text x="78" y="126" fill="#2563eb" text-anchor="middle" font-weight="normal">dah</text>
      <line x1="64" y1="23" x2="40" y2="52" stroke="#111827" stroke-width="1.5"/>
      <text x="40" y="66" fill="#111827" text-anchor="middle">Sleeve</text>
      <text x="40" y="80" fill="#111827" text-anchor="middle" font-weight="normal">ground</text>
    </g>
    <text x="57" y="150" font-size="11" fill="#4b5563" text-anchor="middle">Straight key: tip + sleeve only</text>
  </g>

  <!-- plug into jack -->
  <path d="M 380 203 L 405 203" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M 401 197 L 410 203 L 401 209" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ======================= 3. BLE key ======================= -->
  <g transform="translate(420,140)">
    <rect x="0" y="0" width="170" height="126" rx="16" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <!-- jack on the left side -->
    <rect x="-8" y="50" width="16" height="26" rx="3" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="0" cy="63" r="5" fill="#111827"/>
    <!-- LED -->
    <circle cx="140" cy="28" r="7" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="128" y="32" font-size="11" fill="#e5e7eb" text-anchor="end">LED</text>
    <!-- USB-C at the bottom -->
    <rect x="66" y="118" width="38" height="14" rx="7" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
    <text x="85" y="72" font-size="16" font-weight="bold" fill="#f9fafb" text-anchor="middle">BLE key</text>
    <text x="85" y="91" font-size="11" fill="#cbd5e1" text-anchor="middle">Seeed XIAO inside</text>
    <text x="16" y="44" font-size="10" fill="#cbd5e1">3.5 mm jack</text>
  </g>

  <!-- USB-C cable down to power -->
  <path d="M 505 272 L 505 330" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(470,330)">
    <rect x="0" y="0" width="70" height="36" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
    <path d="M 39 6 L 29 19 L 37 19 L 31 30 L 43 15 L 35 15 Z" fill="#ca8a04"/>
  </g>
  <text x="505" y="388" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">USB-C</text>
  <text x="505" y="404" font-size="11" fill="#4b5563" text-anchor="middle">power, and charging when</text>
  <text x="505" y="418" font-size="11" fill="#4b5563" text-anchor="middle">a battery is fitted</text>

  <!-- ======================= 4. Bluetooth LE ======================= -->
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
    <path d="M 610 185 Q 620 203 610 221"/>
    <path d="M 624 175 Q 638 203 624 231"/>
    <path d="M 638 165 Q 656 203 638 241"/>
  </g>
  <path d="M 660 203 L 735 203" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M 729 196 L 738 203 L 729 210" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="690" y="140" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Bluetooth LE</text>
  <text x="690" y="156" font-size="11" fill="#4b5563" text-anchor="middle">advertises as</text>
  <text x="690" y="172" font-size="12" font-family="Menlo, Consolas, monospace" fill="#111827" text-anchor="middle">Paddle</text>

  <!-- ======================= 5. phone / tablet / Mac with Longpath ======================= -->
  <g transform="translate(750,120)">
    <!-- laptop -->
    <rect x="34" y="20" width="130" height="84" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <rect x="42" y="28" width="114" height="68" rx="2" fill="#ffffff" stroke="#9ca3af"/>
    <path d="M 22 104 L 176 104 L 168 114 L 30 114 Z" fill="#9ca3af" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- phone in front -->
    <rect x="0" y="52" width="46" height="84" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <rect x="5" y="60" width="36" height="66" rx="2" fill="#ffffff" stroke="#9ca3af"/>
    <!-- sidetone on the laptop screen -->
    <path d="M 82 54 L 90 54 L 100 45 L 100 79 L 90 70 L 82 70 Z" fill="#374151"/>
    <path d="M 107 52 Q 113 62 107 72" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 114 46 Q 124 62 114 78" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Morse on the phone screen -->
    <g fill="#2563eb"><circle cx="13" cy="92" r="3"/><rect x="19" y="89" width="14" height="6" rx="3"/></g>
    <text x="95" y="160" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Longpath app</text>
    <text x="95" y="178" font-size="12" fill="#4b5563" text-anchor="middle">phone, tablet or Mac</text>
    <text x="95" y="194" font-size="12" fill="#4b5563" text-anchor="middle">plays the sidetone</text>
  </g>

  <!-- step numbers -->
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="40" cy="40" r="13" fill="#111827"/><text x="40" y="45">1</text>
    <circle cx="420" cy="40" r="13" fill="#111827"/><text x="420" y="45">2</text>
    <circle cx="750" cy="40" r="13" fill="#111827"/><text x="750" y="45">3</text>
  </g>
  <g font-size="13" fill="#111827">
    <text x="62" y="45">Plug your paddle into the key's jack</text>
    <text x="442" y="45">Power it from USB-C</text>
    <text x="772" y="45">Connect in Longpath</text>
  </g>

  <!-- notes -->
  <line x1="40" y1="438" x2="920" y2="438" stroke="#e5e7eb" stroke-width="1.5"/>
  <g font-size="12" fill="#374151">
    <text x="40" y="460"><tspan font-weight="bold">LED</tspan> lights while you key, even without Bluetooth: a quick check that the paddle is plugged in right.</text>
    <text x="40" y="480"><tspan font-weight="bold">Battery key</tspan> sleeps after ten idle minutes off USB; the next press only wakes it, keying resumes with the one after.</text>
  </g>
</svg>
