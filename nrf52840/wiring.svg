<svg xmlns="http://www.w3.org/2000/svg" width="860" height="900" viewBox="0 0 860 900" font-family="Helvetica, Arial, sans-serif">
  <!-- Fritzing-style wiring: Seeed XIAO nRF52840 to a 3.5 mm TRS jack.
       Dit = D1 (tip, P0.03), Dah = D2 (ring, P0.28), common = GND (sleeve). Internal pull-ups,
       so there are no external resistors. A straight key uses tip + sleeve only.
       The jack wiring is the same as on the ESP32-S3 key (../esp32s3/wiring.svg).
       The strip at the bottom is the optional battery: a LiPo on the underside BAT pads and
       nothing else. Divider (1 MOhm / 510 kOhm into P0.31, switched by P0.14), the BQ25100's
       ~CHG line (P0.17) and the VBUS detector are all on the board or in the chip. -->
  <rect width="860" height="900" fill="#ffffff"/>

  <!-- ======================= wires (behind the parts) ======================= -->
  <!-- D1 (dit) → Tip : yellow -->
  <path d="M 120 142 C 50 142, 45 400, 170 462 C 215 480, 250 477, 280 477"
        fill="none" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
  <!-- D2 (dah) → Ring : blue -->
  <path d="M 120 174 C 70 174, 68 420, 190 492 C 230 505, 255 497, 280 497"
        fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <!-- GND → Sleeve : black. Routed above the socket and down its left side — the solder
       lugs are on the left, so approaching from the right would run behind the body. -->
  <path d="M 300 142 C 392 142, 396 340, 374 402 C 358 430, 318 422, 288 428 C 266 432, 260 450, 282 457"
        fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>

  <!-- ======================= XIAO nRF52840 ======================= -->
  <g transform="translate(120,70)">
    <rect x="0" y="0" width="180" height="300" rx="16" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <rect x="55" y="-14" width="70" height="34" rx="8" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
    <rect x="30" y="60" width="120" height="120" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <text x="90" y="115" font-size="14" fill="#475569" text-anchor="middle">nRF52840</text>
    <text x="90" y="133" font-size="10" fill="#64748b" text-anchor="middle">XIAO</text>
    <circle cx="150" cy="40" r="5" fill="#3b82f6" stroke="#1d4ed8"/>
    <text x="140" y="44" font-size="9" fill="#e5e7eb" text-anchor="end">RGB</text>
    <circle cx="34" cy="12" r="5" fill="#22c55e" stroke="#15803d"/>
    <text x="24" y="16" font-size="9" fill="#e5e7eb" text-anchor="end">CHG</text>
    <text x="90" y="285" font-size="12" fill="#e5e7eb" text-anchor="middle">Seeed XIAO</text>
    <text x="90" y="285" dy="14" font-size="12" fill="#e5e7eb" text-anchor="middle">nRF52840</text>

    <!-- left pin column -->
    <g font-size="11" fill="#e5e7eb">
      <circle cx="0" cy="40"  r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="0" cy="72"  r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="0" cy="104" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="0" cy="136" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="0" cy="168" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="0" cy="200" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="0" cy="232" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <text x="12" y="44">D0</text>
      <text x="12" y="76"  font-weight="bold">D1</text>
      <text x="12" y="108" font-weight="bold">D2</text>
      <text x="12" y="140">D3</text>
      <text x="12" y="172">D4</text>
      <text x="12" y="204">D5</text>
      <text x="12" y="236">D6</text>
    </g>

    <!-- right pin column -->
    <g font-size="11" fill="#e5e7eb">
      <circle cx="180" cy="40"  r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="180" cy="72"  r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="180" cy="104" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="180" cy="136" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="180" cy="168" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="180" cy="200" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <circle cx="180" cy="232" r="6" fill="#d1a24c" stroke="#8a6d3b"/>
      <text x="168" y="44"  text-anchor="end">5V</text>
      <text x="168" y="76"  text-anchor="end" font-weight="bold">GND</text>
      <text x="168" y="108" text-anchor="end">3V3</text>
      <text x="168" y="140" text-anchor="end">D10</text>
      <text x="168" y="172" text-anchor="end">D9</text>
      <text x="168" y="204" text-anchor="end">D8</text>
      <text x="168" y="236" text-anchor="end">D7</text>
    </g>
  </g>

  <!-- ======================= 3.5 mm TRS jack (panel socket, side view) ======================= -->
  <g transform="translate(302,440)">
    <!-- solder lugs: Sleeve / Tip / Ring, top to bottom -->
    <g stroke="#8a6d3b" fill="#d1a24c">
      <rect x="-22" y="13" width="24" height="8" rx="2"/>
      <rect x="-22" y="33" width="24" height="8" rx="2"/>
      <rect x="-22" y="53" width="24" height="8" rx="2"/>
    </g>
    <circle cx="-16" cy="17" r="2.2" fill="#ffffff" stroke="none"/>
    <circle cx="-16" cy="37" r="2.2" fill="#ffffff" stroke="none"/>
    <circle cx="-16" cy="57" r="2.2" fill="#ffffff" stroke="none"/>
    <!-- body (drawn before the lug labels, which sit on it so the wires can't cross them) -->
    <rect x="2" y="4" width="62" height="66" rx="6" fill="#374151" stroke="#111827" stroke-width="2"/>
    <g font-size="11" font-weight="bold">
      <text x="8" y="21" fill="#e5e7eb">Sleeve</text>
      <text x="8" y="41" fill="#fbbf24">Tip</text>
      <text x="8" y="61" fill="#93c5fd">Ring</text>
    </g>
    <!-- hex nut -->
    <rect x="64" y="12" width="10" height="50" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
    <!-- threaded bushing -->
    <rect x="74" y="22" width="24" height="30" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="79" y1="22" x2="79" y2="52" stroke="#94a3b8" stroke-width="1"/>
    <line x1="85" y1="22" x2="85" y2="52" stroke="#94a3b8" stroke-width="1"/>
    <line x1="91" y1="22" x2="91" y2="52" stroke="#94a3b8" stroke-width="1"/>
    <!-- opening for the plug -->
    <ellipse cx="98" cy="37" rx="5" ry="15" fill="#111827" stroke="#6b7280" stroke-width="1.5"/>
    <text x="34" y="92" font-size="12" fill="#334155" text-anchor="middle">3.5 mm TRS jack</text>
  </g>

  <!-- ======================= TRS plug legend ======================= -->
  <g transform="translate(480,60)">
    <text x="0" y="0" font-size="13" fill="#0f172a" font-weight="bold">TRS plug (key side)</text>
    <rect x="150" y="14" width="90" height="26" rx="6" fill="#374151"/>
    <rect x="86" y="18" width="64" height="18" fill="#9ca3af" stroke="#6b7280"/>
    <rect x="80" y="18" width="6"  height="18" fill="#111827"/>
    <rect x="52" y="18" width="28" height="18" fill="#9ca3af" stroke="#6b7280"/>
    <rect x="46" y="18" width="6"  height="18" fill="#111827"/>
    <path d="M 16 18 L 46 18 L 46 36 L 16 36 Q 4 27 16 18 Z" fill="#9ca3af" stroke="#6b7280"/>
    <line x1="30"  y1="40" x2="30"  y2="52" stroke="#a16207" stroke-width="2"/>
    <line x1="66"  y1="40" x2="98"  y2="52" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="118" y1="40" x2="176" y2="52" stroke="#111827" stroke-width="2"/>
    <g font-size="11">
      <text x="18" y="68" fill="#a16207">Tip</text>
      <text x="18" y="82" fill="#a16207">dit ·</text>
      <text x="86" y="68" fill="#1d4ed8">Ring</text>
      <text x="86" y="82" fill="#1d4ed8">dah −</text>
      <text x="160" y="68" fill="#111827">Sleeve</text>
      <text x="160" y="82" fill="#111827">common</text>
    </g>
  </g>

  <!-- ======================= notes ======================= -->
  <g font-size="13" fill="#334155" transform="translate(480,220)">
    <text y="0"  font-weight="bold" fill="#0f172a">Wiring</text>
    <text y="26"><tspan fill="#a16207" font-weight="bold">D1 → Tip</tspan> — as on the ESP32-S3</text>
    <text y="50"><tspan fill="#1d4ed8" font-weight="bold">D2 → Ring</tspan> — as on the ESP32-S3</text>
    <text y="74"><tspan fill="#111827" font-weight="bold">GND → Sleeve</tspan> — common</text>
    <text y="110">No external resistors — the inputs use the</text>
    <text y="128">nRF52840's internal pull-ups (pressed = LOW).</text>
    <text y="158">A straight key uses only Tip + Sleeve.</text>
    <text y="188" fill="#64748b">The RGB LED is on the board — no wiring:</text>
    <text y="206" fill="#64748b">blue (P0.06) = keying, red (P0.26) = low battery.</text>
    <text y="236" fill="#64748b">Firmware: dit on D2, dah on D1 — swapped</text>
    <text y="254" fill="#64748b">against the ESP32-S3, as measured on the prototype.</text>
  </g>

  <!-- ======================= battery (optional) ======================= -->
  <g transform="translate(0,575)">
    <line x1="40" y1="0" x2="820" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="40" y="26" font-size="13" font-weight="bold" fill="#0f172a">Battery (optional) — the LiPo on the BAT pads is the whole mod</text>

    <!-- LiPo pouch with JST-PH leads -->
    <g transform="translate(40,50)">
      <rect x="0" y="0" width="96" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <text x="48" y="28" font-size="11" fill="#334155" text-anchor="middle">LiPo 3.7 V</text>
      <text x="48" y="44" font-size="10" fill="#64748b" text-anchor="middle">350–500 mAh</text>
      <line x1="96" y1="22" x2="132" y2="22" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <line x1="96" y1="38" x2="132" y2="38" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
      <rect x="132" y="14" width="14" height="32" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="139" y="58" font-size="9" fill="#64748b" text-anchor="middle">JST-PH</text>
      <text x="48" y="74" font-size="9" fill="#64748b" text-anchor="middle">protected (PCM)</text>
    </g>

    <!-- BAT pads on the underside of the XIAO; the pigtail lands on them from the left -->
    <g transform="translate(210,42)">
      <rect x="0" y="0" width="110" height="76" rx="8" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
      <line x1="-24" y1="30" x2="80" y2="30" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <line x1="-24" y1="50" x2="80" y2="50" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
      <rect x="80" y="24" width="16" height="12" rx="2" fill="#d1a24c" stroke="#8a6d3b"/>
      <rect x="80" y="44" width="16" height="12" rx="2" fill="#d1a24c" stroke="#8a6d3b"/>
      <text x="72" y="22" font-size="11" fill="#e5e7eb" text-anchor="end" font-weight="bold">+</text>
      <text x="72" y="66" font-size="11" fill="#e5e7eb" text-anchor="end" font-weight="bold">−</text>
      <text x="104" y="22" font-size="9" fill="#9ca3af" text-anchor="end">BAT</text>
      <text x="8" y="14" font-size="9" fill="#9ca3af">XIAO underside</text>
    </g>
    <text x="180" y="140" font-size="10" fill="#64748b" text-anchor="middle">check the pad polarity with a meter</text>
    <text x="180" y="154" font-size="10" fill="#64748b" text-anchor="middle">before soldering (see ../esp32s3/BATTERY.md)</text>

    <!-- what the board already has: drawn dashed, nothing here is wired by hand -->
    <rect x="370" y="44" width="450" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="386" y="66" font-size="12" font-weight="bold" fill="#475569">On the board — nothing to wire</text>

    <!-- divider: BAT+ — 1M — P0.31 — 510k — P0.14 (VBAT_ENABLE, LOW) -->
    <g transform="translate(400,120)">
      <text x="0" y="-12" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="bold">BAT+</text>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <rect x="20" y="-9" width="70" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="55" y="4" font-size="10" fill="#92400e" text-anchor="middle">1 MΩ</text>
      <line x1="90" y1="0" x2="150" y2="0" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="120" cy="0" r="4" fill="#16a34a"/>
      <line x1="120" y1="0" x2="120" y2="-24" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
      <text x="120" y="-32" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">P0.31 (ADC)</text>
      <rect x="150" y="-9" width="70" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="185" y="4" font-size="10" fill="#92400e" text-anchor="middle">510 kΩ</text>
      <line x1="220" y1="0" x2="250" y2="0" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
      <text x="256" y="0" font-size="11" fill="#111827" font-weight="bold">P0.14</text>
      <text x="256" y="14" font-size="10" fill="#64748b">VBAT_ENABLE, held LOW</text>
    </g>

    <!-- charger status: BQ25100 ~CHG → P0.17 -->
    <g transform="translate(400,170)">
      <rect x="0" y="-12" width="90" height="24" rx="3" fill="#1f2937" stroke="#0f172a"/>
      <text x="45" y="4" font-size="10" fill="#e5e7eb" text-anchor="middle">BQ25100</text>
      <line x1="90" y1="0" x2="150" y2="0" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
      <text x="120" y="-6" font-size="9" fill="#16a34a" text-anchor="middle">~CHG</text>
      <text x="156" y="4" font-size="11" fill="#16a34a" font-weight="bold">P0.17 <tspan font-weight="normal" fill="#64748b">· LOW while charging</tspan></text>
    </g>

    <!-- USB power: the chip's own VBUS detector -->
    <g transform="translate(400,214)">
      <text x="0" y="4" font-size="11" fill="#dc2626" font-weight="bold">USB VBUS</text>
      <line x1="64" y1="0" x2="150" y2="0" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <text x="156" y="4" font-size="11" fill="#111827" font-weight="bold">VBUS detector <tspan font-weight="normal" fill="#64748b">· in the nRF52840</tspan></text>
    </g>

    <g font-size="12" fill="#334155" transform="translate(40,274)">
      <text y="0">Charger, battery divider, <tspan font-weight="bold">~CHG</tspan> line and USB detection are already there: no resistors, and no wires</text>
      <text y="20">to A0, D10 or D3 as on the ESP32-S3. The firmware reads the cell on P0.31 (×1510/510), reports it over the</text>
      <text y="40">BLE Battery Service and tells charging from charged by ~CHG. On USB without a cell the level is unknown (0xFF).</text>
    </g>
  </g>
</svg>
